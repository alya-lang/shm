[package]
name = "shm"
version = "0.1.0"
alya-version = "0.0.19"
entry = "src/lib.alya"
description = "Shared-memory messaging for Alya: memory-mapped ring-buffer channels for fast local IPC"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/shm"
keywords = ["alya", "alya-lang", "package", "shm", "c", "ffi"]

[dependencies]

[build]
c-sources = ["c/shm.c"]
c-flags = ["-O2"]
c-include-dirs = ["c"]
links = "shm"

