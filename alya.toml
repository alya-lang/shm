[package]
name = "shm"
version = "0.1.0"
alya-version = "0.0.19"
entry = "src/lib.alya"
description = "Shared-memory messaging for Alya: memory-mapped ring-buffer channels for fast local IPC"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/shm"
keywords = ["alya", "alya-lang", "package", "shm", "c", "ffi"]

[dependencies]

[build]
c-sources = ["c/shm.c"]
c-flags = ["-O2"]
c-include-dirs = ["c"]
links = "shm"

# Optional: feature-gated API slices. Members name another feature;
# gate the using code with `@cfg(feature = "...")` (see `src/lib.alya`,
# `src/types.alya` and `src/core/channel.alya`). `default` is active
# unless the caller passes `--no-default-features`; select features
# explicitly via `alya build/run/test/bench/install --features <a,b>`.
[features]
default = ["core", "bytes", "broadcast", "rpc"]
core = []
bytes = []
broadcast = []
rpc = []

